<!DOCTYPE html>
<html>
<head>
<title>BloodCare</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
margin:0;
font-family:Poppins,sans-serif;
background:#fff5f5;
}

header{
background:linear-gradient(90deg,#ff416c,#ff4b2b);
padding:20px;
display:flex;
justify-content:space-between;
color:white;
}

.hero{
height:90vh;
background:url('https://images.unsplash.com/photo-1615461066841-6116e61058f4') center/cover;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
}

.hero h1{
font-size:70px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
padding:70px;
}

.card{
background:white;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 0 15px rgba(0,0,0,.1);
}

.card i{
font-size:60px;
color:#ff416c;
}

footer{
background:#7f1d1d;
color:white;
text-align:center;
padding:30px;
}

</style>
</head>

<body>

<header>
<h2>🩸 BloodCare</h2>
<div>Donor | Hospital</div>
</header>

<section class="hero">

<div>
<h1>Donate Blood, Save Lives</h1>
<p>Connecting Donors With Hospitals</p>
</div>

</section>

<div class="grid">

<div class="card">
<i class="fas fa-user-plus"></i>
<h3>Donor Registration</h3>
</div>

<div class="card">
<i class="fas fa-search"></i>
<h3>Search Donors</h3>
</div>

<div class="card">
<i class="fas fa-hospital"></i>
<h3>Blood Banks</h3>
</div>

<div class="card">
<i class="fas fa-tint"></i>
<h3>Blood Groups</h3>
</div>

<div class="card">
<i class="fas fa-heartbeat"></i>
<h3>Emergency Requests</h3>
</div>

<div class="card">
<i class="fas fa-chart-line"></i>
<h3>Blood Stock Analytics</h3>
</div>

</div>

<footer>
© 2026 BloodCare Management System
</footer>

</body>
</html>
