<!DOCTYPE html>
<html>
<head>
<title>EcoWaste Management</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>

body{
font-family:Poppins,sans-serif;
margin:0;
background:#f5fff5;
}

header{
background:linear-gradient(90deg,#11998e,#38ef7d);
padding:20px;
color:white;
display:flex;
justify-content:space-between;
}

.hero{
height:90vh;
background:url('https://images.unsplash.com/photo-1532996122724-e3c354a0b15b') center/cover;
display:flex;
justify-content:center;
align-items:center;
color:white;
text-align:center;
}

.hero h1{
font-size:70px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
padding:70px;
}

.card{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 0 15px rgba(0,0,0,.1);
text-align:center;
}

.card i{
font-size:55px;
color:#11998e;
}

footer{
background:#0f172a;
color:white;
padding:30px;
text-align:center;
}

</style>
</head>
<body>

<header>
<h2>♻️ EcoWaste</h2>
<div>Admin | Driver | Public</div>
</header>

<section class="hero">
<div>
<h1>Smart Waste Management</h1>
<p>Cleaner Cities Through Smart Technology</p>
</div>
</section>

<div class="grid">

<div class="card">
<i class="fas fa-trash"></i>
<h3>Garbage Bin Monitoring</h3>
</div>

<div class="card">
<i class="fas fa-route"></i>
<h3>Route Optimization</h3>
</div>

<div class="card">
<i class="fas fa-truck"></i>
<h3>Driver Dashboard</h3>
</div>

<div class="card">
<i class="fas fa-chart-pie"></i>
<h3>Analytics Reports</h3>
</div>

<div class="card">
<i class="fas fa-map-marker-alt"></i>
<h3>Google Maps Tracking</h3>
</div>

<div class="card">
<i class="fas fa-comments"></i>
<h3>Complaint Management</h3>
</div>

</div>

<footer>
© 2026 EcoWaste Smart Management System
</footer>

</body>
</html>
